name: Demo acceptance
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  powershell:
    name: Check Windows demo helpers
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Analyze scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $scriptPaths = @(Get-ChildItem -LiteralPath scripts, integrations/record-files -File -Filter '*.ps1')
          $findings = @($scriptPaths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings scripts/PSScriptAnalyzerSettings.psd1
          })
          $findings | Format-Table -AutoSize
          if($findings.Count -gt 0) { throw "PowerShell analysis reported $($findings.Count) findings." }
  verify:
    name: Verify demo HTTP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and install qbit
        run: ./mvnw --batch-mode --no-transfer-progress verify install
      - name: Verify native login, enrollment and scan flow
        run: ./mvnw --batch-mode --no-transfer-progress -f demo/pom.xml verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Prepare isolated browser acceptance
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f demo/pom.xml dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath.txt
          npm ci --prefix e2e
          cd e2e
          npx playwright install --with-deps chromium
      - name: Verify record and bulk process screens
        working-directory: e2e
        run: npm test
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-test-reports
          path: |
            target/surefire-reports/
            demo/target/surefire-reports/
            target/checkstyle-result.xml
            demo/target/checkstyle-result.xml
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: warn
