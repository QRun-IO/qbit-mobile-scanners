name: Demo acceptance
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  powershell:
    name: Check Windows demo helpers
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings scripts/PSScriptAnalyzerSettings.psd1 -EnableExit
  verify:
    name: Verify demo HTTP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and install qbit
        run: ./mvnw --batch-mode --no-transfer-progress verify install
      - name: Verify native login, enrollment and scan flow
        run: ./mvnw --batch-mode --no-transfer-progress -f demo/pom.xml verify
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-reports
          path: |
            target/surefire-reports/
            demo/target/surefire-reports/
            target/checkstyle-result.xml
            demo/target/checkstyle-result.xml
          retention-days: 14
          if-no-files-found: warn
